<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="dropletGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrowCyan8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad8)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SMARTWATCH ACOUSTIC CAVITY</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Speaker Port Anatomy &amp; Acoustic Purge Mechanics</text>

  <!-- Main Schematic (Center-Left) -->
  <g transform="translate(100, 100)">
    <!-- Watch Case Wall (Metal Frame) -->
    <path d="M 180,0 L 260,0 L 260,190 L 180,190 L 180,135 L 210,135 L 210,55 L 180,55 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="215" y="30" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Case Wall</text>
    <text x="215" y="170" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Case Wall</text>

    <!-- Speaker Port Slit (The open channel) -->
    <!-- Internal Acoustic Chamber behind port -->
    <rect x="0" y="35" width="180" height="120" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="55" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Internal Speaker Chamber</text>

    <!-- Speaker Cone / Voice Coil Driver -->
    <path d="M 40,65 Q 85,95 40,125" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
    <path d="M 30,75 Q 65,95 30,115" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" opacity="0.6" />
    <path d="M 50,75 Q 95,95 50,115" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Acoustic Wave Pulses Moving Towards Exit -->
    <path d="M 100,75 Q 120,95 100,115" fill="none" stroke="#22d3ee" stroke-width="2" />
    <path d="M 130,70 Q 155,95 130,120" fill="none" stroke="#22d3ee" stroke-width="2.5" />

    <!-- Water-Resistant Acoustic Membrane (Barrier across the inner throat of port) -->
    <line x1="180" y1="55" x2="180" y2="135" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    <line x1="180" y1="65" x2="180" y2="125" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,3" />

    <!-- The Open Acoustic Port Slit (Exterior channel) -->
    <rect x="180" y="55" width="30" height="80" fill="#0b0f19" opacity="0.5" />

    <!-- Escaping Water Droplets -->
    <circle cx="215" cy="85" r="7" fill="url(#dropletGrad8)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="245" cy="98" r="5" fill="url(#dropletGrad8)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="270" cy="88" r="3.5" fill="url(#dropletGrad8)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="290" cy="105" r="2.5" fill="url(#dropletGrad8)" stroke="#38bdf8" stroke-width="1" />

    <!-- Motion arrows for escaping water -->
    <path d="M 225,85 L 260,95" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan8)" />
  </g>

  <!-- Right Side Callout Cards -->

  <!-- 1. Open acoustic port slit -->
  <line x1="430" y1="95" x2="305" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute8)" />
  <text x="440" y="90" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Open acoustic port slit</text>
  <text x="440" y="106" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Side speaker slot allows water to enter and exit</text>

  <!-- 2. Water-resistant acoustic barrier -->
  <line x1="430" y1="155" x2="282" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute8)" />
  <text x="440" y="150" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Water-resistant acoustic barrier</text>
  <text x="440" y="166" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Hydrophobic membrane protects internal circuitry</text>

  <!-- 3. Speaker cone moving with low-frequency pulses -->
  <line x1="430" y1="215" x2="165" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute8)" />
  <text x="440" y="210" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Speaker cone moving with low-frequency pulses</text>
  <text x="440" y="226" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Amplifier drives diaphragm at maximum cone excursion</text>

  <!-- 4. Highlight Box: No mechanical valves or shutters -->
  <g transform="translate(430, 255)">
    <rect width="250" height="58" rx="8" fill="#151d30" stroke="#38bdf8" stroke-width="1.2" />
    <text x="14" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">NO MECHANICAL VALVES OR SHUTTERS</text>
    <text x="14" y="38" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="11">Water Lock is purely software &amp; acoustic ejection;</text>
    <text x="14" y="50" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="10">it does not physically seal or shut the speaker port.</text>
  </g>
</svg>
