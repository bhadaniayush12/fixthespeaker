<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <marker id="arrowCyan6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
    <marker id="arrowRed6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad6)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">HARDWARE RESISTANCE CROSS-SECTION</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Internal Water-Resistant Gaskets &amp; Ingress Vulnerabilities</text>

  <!-- Phone Cutaway Chassis (Left-to-Center) -->
  <g transform="translate(60, 90)">
    <!-- Outside Chassis Edge (Aluminum/Titanium frame) -->
    <path d="M 40,0 L 40,210 L 320,210 L 320,180 L 120,180 L 120,0 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="135" y="140" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Metal Frame Edge</text>

    <!-- Front Glass / OLED Display Panel (Top layer) -->
    <rect x="40" y="-12" width="280" height="12" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="140" y="-18" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Display Glass Panel</text>

    <!-- 1. Perimeter Adhesive Seal (Pink/Cyan waterproof adhesive strip between glass and frame) -->
    <rect x="42" y="0" width="76" height="8" fill="#06b6d4" stroke="#22d3ee" stroke-width="1" />
    <text x="44" y="24" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Adhesive Film</text>

    <!-- Speaker Cavity Port opening on bottom edge -->
    <rect x="180" y="180" width="50" height="30" fill="#0b0f19" />
    <!-- 2. Hydrophobic Speaker Mesh across opening -->
    <line x1="180" y1="195" x2="230" y2="195" stroke="#38bdf8" stroke-width="4" stroke-dasharray="3,2" />

    <!-- 3. USB-C Port Opening and Silicone Gasket -->
    <rect x="250" y="180" width="55" height="30" fill="#0b0f19" />
    <!-- Silicone Gasket Ring surrounding port -->
    <rect x="245" y="175" width="65" height="6" rx="2" fill="#3b82f6" opacity="0.85" />
    <rect x="245" y="209" width="65" height="6" rx="2" fill="#3b82f6" opacity="0.85" />
    <!-- Internal electrical pins in port -->
    <line x1="260" y1="195" x2="295" y2="195" stroke="#e2e8f0" stroke-width="2" />

    <!-- Outside liquid pooling at port and mesh -->
    <path d="M 160,220 C 190,210 210,215 220,225 C 230,210 270,210 290,225 Z" fill="#0284c7" opacity="0.6" />
    <circle cx="205" cy="210" r="4" fill="#38bdf8" />
    <circle cx="275" cy="212" r="5" fill="#38bdf8" />
  </g>

  <!-- Right Side Callout Cards & Pointers -->

  <!-- Callout 1: Perimeter adhesive seal -->
  <line x1="420" y1="100" x2="160" y2="94" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute6)" />
  <text x="430" y="95" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Perimeter adhesive seal</text>
  <text x="430" y="111" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Watertight barrier bonding glass to frame</text>

  <!-- Callout 2: Heat softens adhesive (Warning) -->
  <line x1="420" y1="145" x2="140" y2="105" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed6)" />
  <text x="430" y="145" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Heat softens adhesive</text>
  <text x="430" y="161" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">Hairdryers melt seal glue, letting liquid in</text>

  <!-- Callout 3: Hydrophobic speaker mesh -->
  <line x1="420" y1="205" x2="270" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute6)" />
  <text x="430" y="205" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Hydrophobic speaker mesh</text>
  <text x="430" y="221" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Repels droplets while allowing air acoustic pulses</text>

  <!-- Callout 4: Silicone port gasket -->
  <line x1="420" y1="265" x2="335" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute6)" />
  <text x="430" y="265" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Silicone port gasket</text>
  <text x="430" y="281" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Seals charging connector from internal logic board</text>
</svg>
