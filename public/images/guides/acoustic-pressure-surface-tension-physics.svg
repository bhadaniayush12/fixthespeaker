<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="dropletGrad9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrowCyan9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad9)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">FLUID DYNAMICS SCHEMATIC</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Acoustic Radiation Pressure Overcoming Surface Tension</text>

  <!-- Cutaway of a Single Microscopic Pore (Center-Left) -->
  <g transform="translate(60, 90)">
    <!-- Top Pore Wall Structure -->
    <path d="M 50,20 L 260,20 L 260,65 L 170,65 C 160,65 155,75 155,85 L 50,85 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Bottom Pore Wall Structure -->
    <path d="M 50,200 L 155,200 C 155,210 160,220 170,220 L 260,220 L 260,265 L 50,265 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Interior Chamber (Left side of pore) -->
    <text x="60" y="55" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Interior Cavity</text>
    <text x="210" y="55" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Exterior</text>

    <!-- Rapid Acoustic Air Compression Waves traveling from Left to Right -->
    <path d="M 70,110 Q 95,142 70,175" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M 95,100 Q 120,142 95,185" fill="none" stroke="#22d3ee" stroke-width="3.5" />
    <path d="M 120,90 Q 148,142 120,195" fill="none" stroke="#22d3ee" stroke-width="4" />

    <!-- Acoustic Force Arrows -->
    <path d="M 80,142 L 145,142" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrowCyan9)" />

    <!-- Meniscus Surface Tension Barrier (Concave curved liquid boundary held in the throat) -->
    <path d="M 170,65 Q 145,142 170,220 C 190,220 205,190 200,142 C 205,95 190,65 170,65 Z" fill="url(#dropletGrad9)" stroke="#38bdf8" stroke-width="2" opacity="0.85" />
    
    <!-- Surface tension vectors along the pore lip -->
    <path d="M 160,78 Q 155,100 152,120" stroke="#f4f6fb" stroke-width="1.5" stroke-dasharray="2,2" />
    <path d="M 160,207 Q 155,185 152,165" stroke="#f4f6fb" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Detached Ejected Micro-Droplets Propelled Outward (Right) -->
    <circle cx="250" cy="142" r="14" fill="url(#dropletGrad9)" stroke="#7dd3fc" stroke-width="1.5" />
    <ellipse cx="245" cy="136" rx="4" ry="6" fill="#ffffff" opacity="0.4" />

    <circle cx="295" cy="120" r="8" fill="url(#dropletGrad9)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="325" cy="155" r="6" fill="url(#dropletGrad9)" stroke="#7dd3fc" stroke-width="1" />
    <circle cx="350" cy="130" r="4" fill="url(#dropletGrad9)" stroke="#7dd3fc" stroke-width="1" />

    <!-- Trajectory lines -->
    <path d="M 210,142 L 230,142" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan9)" />
    <path d="M 268,136 L 282,125" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan9)" />
  </g>

  <!-- Right Side Callout Cards -->

  <!-- 1. Acoustic chamber pressure pulse -->
  <line x1="440" y1="95" x2="190" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute9)" />
  <text x="450" y="90" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Acoustic chamber pressure pulse</text>
  <text x="450" y="106" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Cone excursion compresses air behind the pore</text>

  <!-- 2. Water-resistant mesh pore -->
  <line x1="440" y1="155" x2="280" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute9)" />
  <text x="450" y="150" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Water-resistant mesh pore</text>
  <text x="450" y="166" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Microscopic aperture retains droplets by cohesion</text>

  <!-- 3. Meniscus surface tension barrier -->
  <line x1="440" y1="215" x2="235" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute9)" />
  <text x="450" y="210" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Meniscus surface tension barrier</text>
  <text x="450" y="226" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Gravity alone cannot overcome capillary pressure</text>

  <!-- 4. Ejected micro-droplets -->
  <line x1="440" y1="275" x2="355" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute9)" />
  <text x="450" y="270" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Ejected micro-droplets</text>
  <text x="450" y="286" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Localized pressure spike shatters droplet meniscus</text>
</svg>
