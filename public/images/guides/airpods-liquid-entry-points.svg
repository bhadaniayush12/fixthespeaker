<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="podBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <marker id="arrowCyan3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad3)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">WIRELESS EARBUD ANATOMY</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Liquid Entry Points &amp; Critical Contact Zones</text>

  <!-- Earbud Drawing (Center-Left) -->
  <g transform="translate(320, 195) rotate(-25)">
    <!-- Stem -->
    <rect x="-14" y="20" width="28" height="95" rx="12" fill="url(#podBody)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Stem Charging Contacts (Silver rings at bottom) -->
    <path d="M -14,102 L 14,102 L 14,115 Q 14,120 0,120 Q -14,120 -14,115 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1" />
    <line x1="-14" y1="108" x2="14" y2="108" stroke="#f1f5f9" stroke-width="2" />

    <!-- Head / Body bulb -->
    <ellipse cx="-20" cy="15" rx="36" ry="32" fill="url(#podBody)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- External microphone grille (back of head) -->
    <rect x="-5" y="-5" width="10" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Nozzle / Ear Tip Attachment Ring -->
    <path d="M -54,15 C -54,4 -48,-3 -38,-5 L -38,35 C -48,33 -54,26 -54,15 Z" fill="#64748b" stroke="#334155" stroke-width="1.5" />

    <!-- Primary Speaker Acoustic Mesh (Black oval mesh on nozzle) -->
    <ellipse cx="-52" cy="15" rx="5" ry="12" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Mesh pattern -->
    <line x1="-54" y1="9" x2="-50" y2="9" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="-55" y1="15" x2="-49" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="-54" y1="21" x2="-50" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.8" />

    <!-- Detachable Silicone Ear Tip (Pulled off, shown separated to the left) -->
    <g transform="translate(-40, 0)">
      <path d="M -45,15 C -45,-5 -30,-12 -22,-8 C -26,-2 -26,32 -22,38 C -30,42 -45,35 -45,15 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" opacity="0.9" />
      <path d="M -22,-8 C -18,-5 -18,35 -22,38" fill="none" stroke="#64748b" stroke-width="1" />
    </g>
  </g>

  <!-- Separation arrow for ear tip -->
  <line x1="220" y1="165" x2="195" y2="155" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan3)" />

  <!-- Water droplets indicator around mesh -->
  <circle cx="235" cy="180" r="5" fill="#38bdf8" opacity="0.9" />
  <circle cx="242" cy="192" r="3.5" fill="#38bdf8" opacity="0.9" />

  <!-- Callouts -->

  <!-- 1. Primary Acoustic Mesh -->
  <line x1="200" y1="100" x2="235" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute3)" />
  <text x="36" y="90" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Primary acoustic mesh (water traps here)</text>
  <text x="36" y="106" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fine barrier blocks sound when wet</text>

  <!-- 2. Detachable silicone ear tip -->
  <line x1="160" y1="235" x2="185" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute3)" />
  <text x="36" y="250" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Detachable silicone ear tip</text>
  <text x="36" y="266" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Remove to clear water pooling in groove</text>

  <!-- 3. External microphone grille -->
  <line x1="450" y1="100" x2="350" y2="135" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute3)" />
  <text x="460" y="95" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">External microphone grille</text>
  <text x="460" y="111" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">ANC mic; wet mesh causes squeal or static</text>

  <!-- 4. Stem charging contacts -->
  <line x1="450" y1="260" x2="395" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute3)" />
  <text x="460" y="255" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Stem charging contacts (keep dry)</text>
  <text x="460" y="271" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">Never insert in case while wet — causes shorts</text>
</svg>
