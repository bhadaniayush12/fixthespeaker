<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="whitePlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <marker id="arrowCyan4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad4)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">DRYING SETUP</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Correct Air-Drying Orientation for Earbuds &amp; Case</text>

  <!-- Desk Surface Baseline -->
  <line x1="40" y1="285" x2="680" y2="285" stroke="#1e293b" stroke-width="2" />

  <!-- Microfiber Cloth Base -->
  <rect x="180" y="270" width="460" height="15" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <line x1="190" y1="277" x2="630" y2="277" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Desk Fan (Left) -->
  <g transform="translate(90, 160)">
    <path d="M -22,115 L 22,115 Q 26,115 26,120 L -26,120 Q -26,115 -22,115 Z" fill="#334155" />
    <line x1="0" y1="115" x2="0" y2="50" stroke="#475569" stroke-width="4" />
    <circle cx="0" cy="20" r="35" fill="#151d30" stroke="#475569" stroke-width="2" />
    <ellipse cx="0" cy="20" rx="8" ry="24" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(30 0 20)" />
    <ellipse cx="0" cy="20" rx="8" ry="24" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(90 0 20)" />
    <ellipse cx="0" cy="20" rx="8" ry="24" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(150 0 20)" />
    <circle cx="0" cy="20" r="6" fill="#06b6d4" />
  </g>

  <!-- Fan Airflow lines -->
  <path d="M 135,160 Q 185,165 240,195" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4" opacity="0.85" />
  <path d="M 135,180 Q 200,185 280,220" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="5,4" opacity="0.85" />
  <path d="M 135,200 Q 220,215 340,245" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,4" opacity="0.85" />

  <!-- Earbud 1 (Face down, speaker nozzle pointing straight into cloth) -->
  <g transform="translate(260, 245) rotate(75)">
    <rect x="-8" y="0" width="16" height="55" rx="8" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="-12" cy="0" rx="18" ry="16" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1" />
    <!-- Speaker nozzle pointing onto cloth -->
    <rect x="-24" y="-7" width="12" height="14" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Earbud 2 (Also face down) -->
  <g transform="translate(370, 245) rotate(75)">
    <rect x="-8" y="0" width="16" height="55" rx="8" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="-12" cy="0" rx="18" ry="16" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1" />
    <rect x="-24" y="-7" width="12" height="14" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Inverted Open Charging Case (Right side) -->
  <g transform="translate(540, 220)">
    <!-- Case Main Body (Upside down, opening downward) -->
    <rect x="-42" y="-45" width="84" height="65" rx="16" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Charging recesses opening at bottom -->
    <path d="M -28,20 C -28,5 -10,5 -10,20 Z" fill="#0f172a" />
    <path d="M 10,20 C 10,5 28,5 28,20 Z" fill="#0f172a" />
    <!-- Open Lid angled back/aside -->
    <path d="M 42,-15 Q 60,-15 65,-5 L 42,-5 Z" fill="url(#whitePlastic)" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Callouts -->

  <!-- 1. Cool ambient fan airflow -->
  <line x1="120" y1="100" x2="185" y2="165" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute4)" />
  <text x="60" y="85" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Cool ambient fan airflow</text>
  <text x="60" y="100" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Accelerates evaporation safely</text>

  <!-- 2. Speaker mesh facing downward onto cloth -->
  <line x1="310" y1="160" x2="310" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute4)" />
  <text x="240" y="145" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Speaker mesh facing downward onto cloth</text>
  <text x="240" y="160" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Water wicks away into absorbent towel</text>

  <!-- 3. Charging case inverted with lid open -->
  <line x1="560" y1="130" x2="540" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute4)" />
  <text x="460" y="115" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Charging case inverted with lid open</text>
  <text x="460" y="130" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Drains moisture away from internal pins</text>

  <!-- 4. Warning Badge: No rice, no heat -->
  <g transform="translate(480, 295)">
    <rect width="210" height="50" rx="8" fill="#1f1315" stroke="#ef4444" stroke-width="1.2" />
    <text x="14" y="22" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">DO NOT USE:</text>
    <text x="14" y="38" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">No rice, no hairdryer, no heat source</text>
  </g>
</svg>
