<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <marker id="arrowCyan5" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#22d3ee" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad5)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">EMERGENCY ACTION TIMELINE</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">The First 10 Minutes: Step-by-Step Response</text>

  <!-- Timeline Track Bar across center -->
  <line x1="60" y1="170" x2="660" y2="170" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <line x1="60" y1="170" x2="660" y2="170" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- STEP 1: Min 0-1 -->
  <g transform="translate(110, 170)">
    <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#22d3ee" stroke-width="3" />
    <text x="0" y="5" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
    
    <!-- Top Card: Time & Icon -->
    <rect x="-65" y="-85" width="130" height="60" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="-66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIN 0 – 1</text>
    <text x="0" y="-48" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Retrieve Phone</text>
    <text x="0" y="-34" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Power Off immediately</text>

    <!-- Bottom Description -->
    <text x="0" y="42" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cut the Power</text>
    <text x="0" y="60" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Stops current from</text>
    <text x="0" y="75" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">shorting wet circuits</text>
  </g>

  <!-- STEP 2: Min 1-3 -->
  <g transform="translate(270, 170)">
    <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#22d3ee" stroke-width="3" />
    <text x="0" y="5" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
    
    <!-- Top Card -->
    <rect x="-65" y="-85" width="130" height="60" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="-66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIN 1 – 3</text>
    <text x="0" y="-48" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Strip Accessories</text>
    <text x="0" y="-34" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Remove case &amp; SIM</text>

    <!-- Bottom Description -->
    <text x="0" y="42" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Uncover Ports</text>
    <text x="0" y="60" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Trapped case pools</text>
    <text x="0" y="75" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">water against seals</text>
  </g>

  <!-- STEP 3: Min 3-5 -->
  <g transform="translate(430, 170)">
    <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#22d3ee" stroke-width="3" />
    <text x="0" y="5" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
    
    <!-- Top Card -->
    <rect x="-65" y="-85" width="130" height="60" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="-66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIN 3 – 5</text>
    <text x="0" y="-48" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Expel Loose Liquid</text>
    <text x="0" y="-34" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Gently tap port downward</text>

    <!-- Bottom Description -->
    <text x="0" y="42" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tap Against Hand</text>
    <text x="0" y="60" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Dislodges surface drops</text>
    <text x="0" y="75" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">held by meniscus</text>
  </g>

  <!-- STEP 4: Min 5-10 -->
  <g transform="translate(590, 170)">
    <circle cx="0" cy="0" r="16" fill="#0b0f19" stroke="#22d3ee" stroke-width="3" />
    <text x="0" y="5" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>
    
    <!-- Top Card -->
    <rect x="-65" y="-85" width="130" height="60" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="-66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MIN 5 – 10</text>
    <text x="0" y="-48" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Begin Fan Drying</text>
    <text x="0" y="-34" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cool moving air (no heat)</text>

    <!-- Bottom Description -->
    <text x="0" y="42" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Prop in Airflow</text>
    <text x="0" y="60" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Wait until fully dry before</text>
    <text x="0" y="75" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">charging or turning on</text>
  </g>

  <!-- Progress Flow Arrows -->
  <path d="M 175,170 L 250,170" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan5)" />
  <path d="M 335,170 L 410,170" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan5)" />
  <path d="M 495,170 L 570,170" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan5)" />
</svg>
