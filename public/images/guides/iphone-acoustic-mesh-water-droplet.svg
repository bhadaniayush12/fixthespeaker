<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="dropletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e2536" stroke-width="2" />

  <!-- Title / Eyebrow Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SPEAKER CAVITY CROSS-SECTION</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Acoustic Vibration Dislodging Trapped Water</text>

  <!-- Speaker Cavity Chamber Enclosure (Left Side) -->
  <rect x="70" y="90" width="220" height="210" rx="8" fill="#151d30" stroke="#1e293b" stroke-width="2" />
  <text x="85" y="115" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Internal Speaker Cavity</text>

  <!-- Diaphragm / Cone -->
  <path d="M 110,130 Q 155,195 110,260" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  <!-- Diaphragm Vibration indicators -->
  <path d="M 125,145 Q 165,195 125,245" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
  <path d="M 95,145 Q 145,195 95,245" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Acoustic Waves travelling right -->
  <path d="M 175,160 Q 195,195 175,230" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.8" />
  <path d="M 210,145 Q 235,195 210,245" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.8" />
  <path d="M 245,130 Q 275,195 245,260" fill="none" stroke="#22d3ee" stroke-width="3" />

  <!-- Phone Exterior Wall & Speaker Mesh Grille (Vertical Barrier) -->
  <rect x="290" y="80" width="24" height="70" fill="#2d3748" />
  <rect x="290" y="240" width="24" height="70" fill="#2d3748" />

  <!-- Mesh Area with porous lines -->
  <line x1="290" y1="150" x2="290" y2="240" stroke="#06b6d4" stroke-width="4" />
  <!-- Mesh Cross-Hatch pattern -->
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.7">
    <line x1="290" y1="160" x2="300" y2="160" />
    <line x1="290" y1="175" x2="300" y2="175" />
    <line x1="290" y1="190" x2="300" y2="190" />
    <line x1="290" y1="205" x2="300" y2="205" />
    <line x1="290" y1="220" x2="300" y2="220" />
    <line x1="290" y1="235" x2="300" y2="235" />
  </g>

  <!-- Trapped Water Droplet blocking the mesh -->
  <path d="M 292,175 C 320,175 328,195 328,205 C 328,218 316,225 292,225 Z" fill="url(#dropletGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Droplet shine -->
  <ellipse cx="308" cy="192" rx="4" ry="7" fill="#ffffff" opacity="0.4" transform="rotate(-20 308 192)" />

  <!-- Ejected Micro-Droplets Propelled Outward -->
  <!-- Droplet 1 -->
  <circle cx="390" cy="180" r="9" fill="url(#dropletGrad)" stroke="#7dd3fc" stroke-width="1" />
  <!-- Droplet 2 -->
  <circle cx="445" cy="210" r="6.5" fill="url(#dropletGrad)" stroke="#7dd3fc" stroke-width="1" />
  <!-- Droplet 3 -->
  <circle cx="475" cy="175" r="4.5" fill="url(#dropletGrad)" stroke="#7dd3fc" stroke-width="1" />
  <!-- Droplet 4 -->
  <circle cx="510" cy="198" r="3.5" fill="url(#dropletGrad)" stroke="#7dd3fc" stroke-width="1" />

  <!-- Outward motion arrows -->
  <path d="M 335,198 L 372,185" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 405,183 L 432,202" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />
  <path d="M 455,208 L 498,198" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- Exterior Space (Right Side) -->
  <text x="440" y="115" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Exterior Environment</text>

  <!-- Callout 1: Speaker Diaphragm -->
  <line x1="80" y1="285" x2="110" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute)" />
  <text x="36" y="308" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Speaker diaphragm vibrating at 165Hz</text>

  <!-- Callout 2: Water-Resistant Acoustic Mesh -->
  <line x1="230" y1="75" x2="285" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute)" />
  <text x="145" y="65" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Water-resistant acoustic mesh</text>

  <!-- Callout 3: Trapped Surface Droplet -->
  <line x1="330" y1="260" x2="315" y2="225" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute)" />
  <text x="270" y="280" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Trapped surface droplet</text>
  <text x="270" y="296" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Blocks sound wave escape</text>

  <!-- Callout 4: Dislodged Water Droplets -->
  <line x1="490" y1="260" x2="455" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute)" />
  <text x="450" y="280" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Dislodged water droplets</text>
  <text x="450" y="296" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Propelled out by kinetic pressure</text>
</svg>
