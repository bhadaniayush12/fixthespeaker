<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">Why Is My Phone Speaker Crackling? What to Check First</title><desc id="desc">Crackling checklist: playback, call checks, outside openings, then manufacturer support.</desc><rect width="720" height="440" rx="20" fill="#fafafa"/><rect x="40" y="22" width="640" height="80" rx="14" fill="#eff6ff" stroke="#64748b"/><text x="360" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a">Check playback</text><text x="360" y="79" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Volume, restart and app behavior</text><path d="M360 103v21m-6-6 6 6 6-6" fill="none" stroke="#475569" stroke-width="2"/><rect x="40" y="126" width="640" height="80" rx="14" fill="#f0fdfa" stroke="#64748b"/><text x="360" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a">Separate call trouble</text><text x="360" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Follow the call-specific support checks</text><path d="M360 207v21m-6-6 6 6 6-6" fill="none" stroke="#475569" stroke-width="2"/><rect x="40" y="230" width="640" height="80" rx="14" fill="#fff7ed" stroke="#64748b"/><text x="360" y="261" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a">Inspect outside openings</text><text x="360" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Remove obstructing covers; clean as directed</text><path d="M360 311v21m-6-6 6 6 6-6" fill="none" stroke="#475569" stroke-width="2"/><rect x="40" y="334" width="640" height="80" rx="14" fill="#f5f3ff" stroke="#64748b"/><text x="360" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#0f172a">Still distorted?</text><text x="360" y="391" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#334155">Contact the phone manufacturer</text></svg>
