<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrowCyan2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
    <marker id="arrowMute2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad2)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SAFE DRYING PROTOCOL</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Recommended Device Drying Orientation</text>

  <!-- Desk Surface Baseline -->
  <line x1="50" y1="290" x2="670" y2="290" stroke="#1e293b" stroke-width="2" />

  <!-- Absorbent Microfiber Towel Base -->
  <path d="M 180,278 L 420,278 Q 430,278 430,286 L 430,290 L 170,290 L 170,286 Q 170,278 180,278 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <!-- Towel texture pattern -->
  <line x1="190" y1="284" x2="410" y2="284" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Generic Phone Propped Upright (Tilted slightly, bottom down) -->
  <g transform="translate(280, 80) rotate(-6)">
    <!-- Phone outline -->
    <rect x="-45" y="0" width="90" height="185" rx="14" fill="url(#phoneBody)" stroke="#475569" stroke-width="2.5" />
    <!-- Screen area -->
    <rect x="-38" y="10" width="76" height="155" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <!-- Top speaker / sensor notch outline (top of phone is tilted up) -->
    <line x1="-12" y1="6" x2="12" y2="6" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <!-- Bottom edge with speaker openings (resting on cloth) -->
    <line x1="-28" y1="180" x2="-12" y2="180" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="180" r="2.5" fill="#475569" />
    <line x1="12" y1="180" x2="28" y2="180" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Prop stand / resting support behind phone -->
  <path d="M 235,210 L 255,278" stroke="#334155" stroke-width="4" stroke-linecap="round" />

  <!-- Desk Fan (Left side, blowing air right toward phone) -->
  <g transform="translate(100, 160)">
    <!-- Fan base & stand -->
    <path d="M -25,120 L 25,120 Q 30,120 30,125 L -30,125 Q -30,120 -25,120 Z" fill="#334155" />
    <line x1="0" y1="120" x2="0" y2="50" stroke="#475569" stroke-width="4" />
    <!-- Fan head cage -->
    <circle cx="0" cy="20" r="38" fill="#151d30" stroke="#475569" stroke-width="2" />
    <!-- Fan blades -->
    <ellipse cx="0" cy="20" rx="9" ry="26" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(30 0 20)" />
    <ellipse cx="0" cy="20" rx="9" ry="26" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(90 0 20)" />
    <ellipse cx="0" cy="20" rx="9" ry="26" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" transform="rotate(150 0 20)" />
    <circle cx="0" cy="20" r="7" fill="#06b6d4" />
  </g>

  <!-- Fan Airflow Lines moving toward the phone bottom -->
  <path d="M 150,170 Q 190,175 240,200" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" opacity="0.85" />
  <path d="M 150,185 Q 195,190 250,225" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" />
  <path d="M 150,200 Q 195,215 245,250" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" opacity="0.85" />

  <!-- Distance indicator: ~12 inches -->
  <line x1="145" y1="260" x2="250" y2="260" stroke="#828a9b" stroke-width="1" stroke-dasharray="2,2" />
  <text x="175" y="254" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="10">~12 in (30 cm)</text>

  <!-- Callouts and Labels -->

  <!-- 1. Gentle ambient fan airflow -->
  <line x1="130" y1="100" x2="190" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute2)" />
  <text x="70" y="85" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Gentle ambient fan airflow</text>
  <text x="70" y="100" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Cool moving air accelerates drying</text>

  <!-- 2. Bottom speaker facing down -->
  <line x1="430" y1="240" x2="310" y2="255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute2)" />
  <text x="440" y="235" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Bottom speaker facing down</text>
  <text x="440" y="250" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Gravity assists water drainage</text>

  <!-- 3. Absorbent microfiber base -->
  <line x1="440" y1="285" x2="390" y2="285" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowMute2)" />
  <text x="450" y="288" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Absorbent microfiber base</text>

  <!-- 4. Warning Box: No heat or compressed air -->
  <g transform="translate(480, 90)">
    <rect width="200" height="85" rx="8" fill="#1f1315" stroke="#ef4444" stroke-width="1.5" />
    <path d="M 20,24 L 26,34 L 14,34 Z" fill="none" stroke="#ef4444" stroke-width="2" />
    <circle cx="20" cy="31" r="1" fill="#ef4444" />
    <line x1="20" y1="27" x2="20" y2="29" stroke="#ef4444" stroke-width="1.5" />
    <text x="36" y="32" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">DO NOT USE:</text>
    <text x="18" y="52" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">• No hairdryer, heat gun or oven</text>
    <text x="18" y="68" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">• No compressed air cans</text>
    <text x="18" y="84" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11">• No rice or sealed containers</text>
  </g>
</svg>
