<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <marker id="arrowCyan7" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#22d3ee" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad7)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">WATCH OPERATION FLOW</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Water Lock Activation and Ejection Sequence</text>

  <!-- STEP 1: Control Center (Turn On) -->
  <g transform="translate(130, 185)">
    <!-- Watch Body Outline -->
    <rect x="-65" y="-80" width="130" height="155" rx="30" fill="#151d30" stroke="#334155" stroke-width="2" />
    <!-- Screen area -->
    <rect x="-55" y="-70" width="110" height="135" rx="20" fill="#0b0f19" />
    <!-- Digital Crown on right -->
    <rect x="65" y="-35" width="8" height="26" rx="2" fill="#475569" />

    <!-- Droplet Icon in Control Center button -->
    <circle cx="0" cy="-5" r="28" fill="#0284c7" opacity="0.3" />
    <path d="M 0,-24 C -12,-8 -16,3 -16,11 C -16,20 -7,27 0,27 C 7,27 16,20 16,11 C 16,3 12,-8 0,-24 Z" fill="#38bdf8" />

    <!-- Labels -->
    <text x="0" y="-88" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 1: ACTIVATE</text>
    <text x="0" y="98" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tap droplet to lock screen</text>
    <text x="0" y="113" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">In Control Center or Workout</text>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 215,185 L 265,185" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan7)" />

  <!-- STEP 2: Locked State (Submerged / In Water) -->
  <g transform="translate(360, 185)">
    <!-- Watch Body Outline -->
    <rect x="-65" y="-80" width="130" height="155" rx="30" fill="#151d30" stroke="#334155" stroke-width="2" />
    <!-- Screen area -->
    <rect x="-55" y="-70" width="110" height="135" rx="20" fill="#0b0f19" />
    <!-- Digital Crown on right -->
    <rect x="65" y="-35" width="8" height="26" rx="2" fill="#475569" />

    <!-- Small Cyan Droplet Indicator at Top Center of Watch Face -->
    <path d="M 0,-54 C -5,-46 -7,-40 -7,-36 C -7,-32 -3,-29 0,-29 C 3,-29 7,-32 7,-36 C 7,-40 5,-46 0,-54 Z" fill="#22d3ee" />

    <!-- Time display on face -->
    <text x="0" y="6" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" text-anchor="middle">10:09</text>

    <!-- Touch input disabled overlay ripples -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4" />

    <!-- Labels -->
    <text x="0" y="-88" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 2: SWIMMING</text>
    <text x="0" y="98" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Screen locked against water touches</text>
    <text x="0" y="113" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">No accidental swipes or pauses</text>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 445,185 L 495,185" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan7)" />

  <!-- STEP 3: Exit & Acoustic Water Eject -->
  <g transform="translate(590, 185)">
    <!-- Watch Body Outline -->
    <rect x="-65" y="-80" width="130" height="155" rx="30" fill="#151d30" stroke="#334155" stroke-width="2" />
    <!-- Screen area -->
    <rect x="-55" y="-70" width="110" height="135" rx="20" fill="#0b0f19" />
    
    <!-- Digital Crown on right: Pressed in indicator -->
    <rect x="65" y="-35" width="6" height="26" rx="2" fill="#22d3ee" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Hand/Finger press arrow -->
    <path d="M 85,-22 L 73,-22" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan7)" />

    <!-- Unlocked message on screen -->
    <text x="0" y="-8" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Unlocked</text>
    <circle cx="0" cy="16" r="14" fill="#06b6d4" opacity="0.2" />
    <path d="M -4,16 L -1,19 L 5,13" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

    <!-- Acoustic Sound Waves from Side Speaker Slit (Left side of watch) -->
    <path d="M -75,-15 Q -90,0 -75,15" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M -83,-25 Q -102,0 -83,25" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Water spray droplets ejected -->
    <circle cx="-100" cy="-6" r="3" fill="#38bdf8" />
    <circle cx="-105" cy="12" r="2.5" fill="#38bdf8" />
    <circle cx="-92" cy="8" r="3.5" fill="#38bdf8" />

    <!-- Labels -->
    <text x="0" y="-88" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEP 3: UNLOCK &amp; EJECT</text>
    <text x="0" y="98" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Press and hold Digital Crown</text>
    <text x="0" y="113" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Acoustic purge ejects water</text>
  </g>
</svg>
