<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111624" />
    </linearGradient>
    <marker id="arrowCyan10" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#22d3ee" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="360" rx="16" fill="url(#bgGrad10)" stroke="#1e2536" stroke-width="2" />

  <!-- Header -->
  <text x="36" y="38" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">FREQUENCY COMPARISON</text>
  <text x="36" y="60" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Cone Excursion: High Frequency vs. 165Hz Low Frequency</text>

  <!-- TOP PANEL: High Frequency (e.g. 5,000Hz - 10,000Hz) -->
  <g transform="translate(40, 85)">
    <rect width="640" height="105" rx="10" fill="#151d30" stroke="#1e293b" stroke-width="1.5" />

    <!-- Speaker Frame / Magnet assembly (Left) -->
    <rect x="20" y="22" width="24" height="60" rx="4" fill="#334155" />
    <!-- Diaphragm (Near vertical, tiny oscillation) -->
    <path d="M 44,25 Q 52,52 44,80" fill="none" stroke="#94a3b8" stroke-width="3" />
    <path d="M 44,25 Q 54,52 44,80" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Tiny Excursion Bracket -->
    <line x1="57" y1="42" x2="57" y2="62" stroke="#64748b" stroke-width="1" />
    <text x="63" y="55" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="10">±0.05 mm</text>

    <!-- Rapid high-frequency sine waves -->
    <path d="M 125,52 
             Q 130,35 135,52 T 145,52 T 155,52 T 165,52 T 175,52 T 185,52 T 195,52 T 205,52 
             T 215,52 T 225,52 T 235,52 T 245,52 T 255,52 T 265,52 T 275,52 T 285,52"
          fill="none" stroke="#64748b" stroke-width="2" />

    <!-- Labels on Right Side -->
    <text x="310" y="44" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">High frequency: rapid vibration, minimal air movement</text>
    <text x="310" y="64" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Driver membrane oscillates in place without moving sufficient air volume to dislodge liquid.</text>
  </g>

  <!-- BOTTOM PANEL: 165Hz Low Frequency -->
  <g transform="translate(40, 205)">
    <rect width="640" height="115" rx="10" fill="#151d30" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Speaker Frame / Magnet assembly (Left) -->
    <rect x="20" y="25" width="24" height="65" rx="4" fill="#334155" />
    
    <!-- Neutral position dotted -->
    <path d="M 44,28 Q 50,57 44,88" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Diaphragm in MAXIMUM FORWARD EXCURSION -->
    <path d="M 44,28 Q 95,57 44,88" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />

    <!-- Large Excursion Measurement Bracket -->
    <line x1="48" y1="96" x2="88" y2="96" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="48" y1="92" x2="48" y2="100" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="88" y1="92" x2="88" y2="100" stroke="#22d3ee" stroke-width="1.5" />
    <text x="50" y="110" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Max Excursion</text>

    <!-- Deep Low-Frequency Piston Waves (High Amplitude) -->
    <path d="M 125,57 Q 155,15 185,57 T 245,57 T 305,57" fill="none" stroke="#22d3ee" stroke-width="3" />

    <!-- Air pulse & water propulsion arrows -->
    <path d="M 230,57 L 275,57" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan10)" />

    <!-- Water droplets escaping right -->
    <circle cx="288" cy="57" r="5" fill="#38bdf8" />
    <circle cx="300" cy="50" r="3" fill="#38bdf8" />

    <!-- Labels on Right Side -->
    <text x="325" y="42" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">165Hz frequency: maximum cone excursion, high air displacement</text>
    <text x="325" y="62" fill="#f4f6fb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Piston effect pushes water outward</text>
    <text x="325" y="80" fill="#828a9b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Large forward physical travel acts as a micro-pump, pushing air through the mesh pores.</text>
  </g>
</svg>
